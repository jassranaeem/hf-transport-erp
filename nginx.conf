# Reverse proxy for HF Transport ERP.
# The Node app listens on 127.0.0.1:3000 (see docker-compose.prod.yml).
# TLS: get a cert with `certbot --nginx -d erp.example.com` (fills in the 443 block).

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/wasm
               text/xml application/xml image/svg+xml;

    # rate limits
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;

    upstream erp_app { server 127.0.0.1:3000; keepalive 32; }

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 80;
        server_name erp.example.com;

        # Uncomment once TLS is set up:
        # return 301 https://$host$request_uri;

        client_max_body_size 50M;

        # security headers (CSP is set by the app via helmet)
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # hashed static assets - cache hard
        location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webmanifest)$ {
            proxy_pass http://erp_app;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # brute-force protection on the auth endpoints
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://erp_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://erp_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA + socket.io (WebSocket upgrade)
        location / {
            proxy_pass http://erp_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }
    }

    # server {
    #     listen 443 ssl http2;
    #     server_name erp.example.com;
    #     ssl_certificate     /etc/letsencrypt/live/erp.example.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/erp.example.com/privkey.pem;
    #     add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    #     ... (same location blocks as above) ...
    # }
}
